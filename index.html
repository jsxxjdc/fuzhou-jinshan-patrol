<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福州金山小学 2026-2027学年 早读巡课系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js?v=1"></script>
<style>
  :root {
    --pri: #4f46e5; --pri-l: #818cf8; --pri-d: #3730a3; --pri-bg: #eef2ff;
    --ok: #059669; --ok-l: #d1fae5; --ok-bg: #ecfdf5;
    --warn: #d97706; --warn-l: #fef3c7; --warn-bg: #fffbeb;
    --err: #dc2626; --err-l: #fee2e2; --err-bg: #fef2f2;
    --cyan: #0891b2; --cyan-l: #cffafe;
    --g50: #f8fafc; --g100: #f1f5f9; --g200: #e2e8f0; --g300: #cbd5e1;
    --g400: #94a3b8; --g500: #64748b; --g600: #475569; --g700: #334155; --g800: #1e293b; --g900: #0f172a;
    --r: 12px; --r-sm: 8px; --r-lg: 16px;
    --sh: 0 1px 3px rgba(0,0,0,.08); --sh-md: 0 4px 12px rgba(0,0,0,.1); --sh-lg: 0 12px 32px rgba(0,0,0,.12);
    --tr: .2s cubic-bezier(.4,0,.2,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;color:var(--g800);background:var(--g100);overflow-x:hidden}

  /* ===== BG PATTERN ===== */
  body::before{content:'';position:fixed;inset:0;background:linear-gradient(135deg,#e0e7ff 0%,#f0f9ff 50%,#faf5ff 100%);z-index:-1}
  body::after{content:'';position:fixed;top:-40%;right:-20%;width:600px;height:600px;background:radial-gradient(circle,rgba(99,102,241,.08) 0%,transparent 70%);border-radius:50%;z-index:-1}

  /* ===== TOP NAV ===== */
  .topnav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.88);backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid rgba(226,232,240,.6);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between}
  .topnav .brand{display:flex;align-items:center;gap:14px}
  .topnav .brand .logo{width:42px;height:42px;border-radius:var(--r);background:linear-gradient(135deg,var(--pri),#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:17px;letter-spacing:1px;box-shadow:0 4px 12px rgba(79,70,229,.35)}
  .topnav .brand .txt h1{font-size:15px;font-weight:700;color:var(--g800);line-height:1.2}
  .topnav .brand .txt p{font-size:11px;color:var(--g400);font-weight:400}
  .nav-tabs{display:flex;gap:4px;background:var(--g100);border-radius:var(--r);padding:4px}
  .nav-tab{padding:8px 22px;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer;transition:var(--tr);font-family:inherit;background:transparent;color:var(--g500)}
  .nav-tab.active{background:#fff;color:var(--pri);box-shadow:var(--sh)}
  .nav-tab:not(.active):hover{color:var(--g700)}

  /* ===== PAGES ===== */
  .pg{display:none;padding:20px 28px 40px;max-width:1480px;margin:0 auto}
  .pg.on{display:block;animation:fadeUp .3s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ===== CARDS ===== */
  .card{background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border:1px solid rgba(226,232,240,.5);border-radius:var(--r-lg);padding:20px 24px;box-shadow:var(--sh)}

  /* ===== TOOLBAR ===== */
  .bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin-bottom:16px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:11px;font-weight:600;color:var(--g400);text-transform:uppercase;letter-spacing:.5px}
  .field input,.field select{padding:9px 14px;border:1.5px solid var(--g200);border-radius:var(--r-sm);font-size:14px;font-family:inherit;background:#fff;transition:var(--tr);min-width:130px;color:var(--g700)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
  .field input.error{border-color:var(--err);box-shadow:0 0 0 3px rgba(220,38,38,.1)}

  /* progress */
  .prog{display:flex;align-items:center;gap:10px;margin-left:auto}
  .prog .track{width:200px;height:7px;background:var(--g200);border-radius:4px;overflow:hidden}
  .prog .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--pri),#7c3aed);transition:width .4s}
  .prog .lbl{font-size:13px;font-weight:600;color:var(--g500);white-space:nowrap}

  /* ===== GRADE TABS ===== */
  .gtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .gtab{padding:9px 22px;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;transition:var(--tr);font-family:inherit;background:rgba(255,255,255,.6);color:var(--g500);border:1.5px solid transparent}
  .gtab.on{background:#fff;color:var(--pri);box-shadow:var(--sh);border-color:var(--pri-l)}
  .gtab:not(.on):hover{background:rgba(255,255,255,.9);color:var(--g700)}

  /* ===== CLASS GRID ===== */
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .ccard{background:#fff;border:2px solid var(--g100);border-radius:var(--r);padding:16px;transition:var(--tr);position:relative;overflow:hidden}
  .ccard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--g200);transition:var(--tr)}
  .ccard:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:var(--g300)}
  .ccard:hover::before{background:var(--pri-l)}
  .ccard.pending{border-color:#fde68a;background:#fffbeb}.ccard.pending::before{background:var(--warn)}
  .ccard.done{border-color:var(--g100);background:#fff}
  .ccard .cnum{font-size:11px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .ccard .tname{font-size:15px;font-weight:700;color:var(--g800);cursor:pointer;padding:6px 10px;border-radius:var(--r-sm);transition:var(--tr);display:inline-block;max-width:100%;word-break:break-all;line-height:1.4}
  .ccard .tname:hover{background:var(--pri-bg);color:var(--pri)}
  .ccard .tbadge{position:absolute;top:10px;right:10px;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;letter-spacing:.3px}
  .tbadge.pending{background:var(--g300);color:#fff}.tbadge.done{background:var(--ok);color:#fff}

  /* ===== SUBMIT ===== */
  .submit-box{margin-top:18px;padding:20px 24px}
  .submit-box h3{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--g700);display:flex;align-items:center;gap:8px}
  .submit-box h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--err)}
  .submit-box textarea{width:100%;padding:12px 14px;border:1.5px solid var(--g200);border-radius:var(--r-sm);font-size:14px;font-family:inherit;resize:vertical;min-height:72px;transition:var(--tr)}
  .submit-box textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.08)}
  .submit-box textarea.er{border-color:var(--err);box-shadow:0 0 0 3px rgba(220,38,38,.08)}
  .submit-row{display:flex;align-items:center;gap:12px;margin-top:12px}
  .btn{padding:11px 30px;border:none;border-radius:var(--r-sm);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:var(--tr)}
  .btn-pri{background:linear-gradient(135deg,var(--pri),#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.3)}
  .btn-pri:hover{box-shadow:0 6px 20px rgba(79,70,229,.4);transform:translateY(-1px)}
  .btn-pri:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-ghost{background:var(--g100);color:var(--g500)}
  .btn-ghost:hover{background:var(--g200)}
  .hint{font-size:12px;color:var(--g400)}

  /* ===== MODAL ===== */
  .overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(6px);z-index:2000;justify-content:center;align-items:center}
  .overlay.on{display:flex}
  .modal{background:#fff;border-radius:var(--r-lg);padding:0;max-width:440px;width:92%;box-shadow:var(--sh-lg);animation:modalIn .25s ease;overflow:hidden}
  @keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}
  .modal-head{padding:22px 24px 0;display:flex;align-items:flex-start;justify-content:space-between}
  .modal-head h3{font-size:17px;font-weight:700;color:var(--g800)}
  .modal-head .close{width:32px;height:32px;border:none;border-radius:var(--r-sm);background:var(--g100);cursor:pointer;font-size:18px;color:var(--g400);display:flex;align-items:center;justify-content:center;transition:var(--tr);flex-shrink:0}
  .modal-head .close:hover{background:var(--g200);color:var(--g600)}
  .modal-body{padding:14px 24px 24px}
  .modal-sub{font-size:13px;color:var(--g500);margin-bottom:16px}
  .modal-sub b{color:var(--pri);font-weight:700}

  .opt-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .opt-btn{padding:14px 16px;border:2px solid var(--g100);border-radius:var(--r);background:#fff;cursor:pointer;text-align:left;transition:var(--tr);display:flex;align-items:center;gap:14px;font-family:inherit}
  .opt-btn:hover{border-color:var(--pri);background:var(--pri-bg)}
  .opt-btn .ico{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .opt-btn .lbl{font-size:14px;font-weight:700;color:var(--g700)}
  .opt-btn .desc{font-size:12px;color:var(--g400);margin-top:1px}
  .ico-p{background:var(--ok-l);color:var(--ok)}
  .ico-n{background:var(--warn-l);color:var(--warn)}
  .ico-o{background:var(--cyan-l);color:var(--cyan)}
  .ico-r{background:var(--pri-bg);color:var(--pri)}

  .sub-input{display:none;margin-bottom:12px}
  .sub-input textarea,.sub-input input{width:100%;padding:11px 14px;border:1.5px solid var(--g200);border-radius:var(--r-sm);font-size:14px;font-family:inherit;transition:var(--tr)}
  .sub-input textarea:focus,.sub-input input:focus{outline:none;border-color:var(--pri)}
  .sub-input textarea{resize:vertical;min-height:64px}
  .sub-actions{display:flex;gap:8px;margin-top:8px}

  /* ===== BACKEND ===== */
  .be-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
  .be-head h2{font-size:18px;font-weight:700;color:var(--g800)}
  .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .filters select,.filters input{padding:8px 12px;border:1.5px solid var(--g200);border-radius:var(--r-sm);font-size:13px;font-family:inherit;background:#fff}
  .filters select:focus,.filters input:focus{outline:none;border-color:var(--pri)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
  .scard{background:#fff;border:1px solid rgba(226,232,240,.5);border-radius:var(--r);padding:18px 16px;text-align:center;transition:var(--tr)}
  .scard:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
  .scard .num{font-size:34px;font-weight:900;line-height:1}
  .scard .lbl{font-size:12px;color:var(--g400);margin-top:6px;font-weight:500}
  .scard.c-pri .num{color:var(--pri)}
  .scard.c-ok .num{color:var(--ok)}
  .scard.c-warn .num{color:var(--warn)}
  .scard.c-err .num{color:var(--err)}
  .scard.c-cyan .num{color:var(--cyan)}

  .sec{background:#fff;border:1px solid rgba(226,232,240,.5);border-radius:var(--r-lg);padding:20px 24px;margin-bottom:16px}
  .sec h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--g700)}
  .sec h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--pri)}

  table.dt{width:100%;border-collapse:collapse;font-size:13px}
  table.dt th{background:var(--g50);padding:10px 14px;text-align:left;font-weight:700;color:var(--g500);border-bottom:2px solid var(--g200);font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  table.dt td{padding:10px 14px;border-bottom:1px solid var(--g100);color:var(--g600)}
  table.dt tr:hover td{background:var(--g50)}
  .bdg{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .bdg.g{background:var(--ok-l);color:var(--ok)}.bdg.y{background:var(--warn-l);color:#92400e}.bdg.b{background:var(--cyan-l);color:var(--cyan)}.bdg.gray{background:var(--g100);color:var(--g500)}

  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .cbox{background:var(--g50);border-radius:var(--r);padding:18px}
  .cbox h4{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--g600)}
  .brow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .brow .bl{width:90px;font-size:12px;color:var(--g500);text-align:right;flex-shrink:0;font-weight:600}
  .brow .bt{flex:1;height:24px;background:var(--g200);border-radius:6px;overflow:hidden}
  .brow .bi{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;font-size:11px;color:#fff;font-weight:700;min-width:fit-content;transition:width .4s}
  .bi-praise{background:linear-gradient(90deg,var(--ok),#34d399)}
  .bi-atten{background:linear-gradient(90deg,var(--warn),#fbbf24)}
  .bi-other{background:linear-gradient(90deg,var(--cyan),#22d3ee)}
  .brow .bc{font-size:13px;font-weight:700;color:var(--g500);width:32px;text-align:right}

  .issues{list-style:none}
  .issues li{padding:14px 16px;background:var(--g50);border-radius:var(--r);margin-bottom:10px;font-size:13px;border-left:4px solid var(--warn);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .issues li .im{font-weight:700;color:var(--g600);white-space:nowrap}
  .issues li .it{color:var(--g700)}

  .empty{text-align:center;padding:48px 20px;color:var(--g400);font-size:14px}
  .empty .ei{font-size:48px;margin-bottom:12px}

  /* ===== PASSWORD MODAL ===== */
  .pw-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(8px);z-index:3000;justify-content:center;align-items:center}
  .pw-overlay.on{display:flex}
  .pw-box{background:#fff;border-radius:var(--r-lg);padding:32px;max-width:380px;width:90%;box-shadow:var(--sh-lg);text-align:center;animation:modalIn .25s ease}
  .pw-box .pw-icon{width:64px;height:64px;border-radius:50%;background:var(--pri-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px}
  .pw-box h3{font-size:18px;font-weight:700;margin-bottom:6px;color:var(--g800)}
  .pw-box p{font-size:13px;color:var(--g400);margin-bottom:20px}
  .pw-box input{width:100%;padding:12px 16px;border:2px solid var(--g200);border-radius:var(--r);font-size:16px;font-family:inherit;text-align:center;letter-spacing:4px;margin-bottom:12px;transition:var(--tr)}
  .pw-box input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px rgba(79,70,229,.1)}
  .pw-box input.er{border-color:var(--err);animation:shake .3s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .pw-err{font-size:12px;color:var(--err);margin-bottom:10px;display:none}
  .pw-box .btn{width:100%}

  /* ===== PERM EDIT MODAL ===== */
  .perm-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(6px);z-index:2500;justify-content:center;align-items:center}
  .perm-overlay.on{display:flex}
  .perm-box{background:#fff;border-radius:var(--r-lg);padding:0;max-width:460px;width:92%;box-shadow:var(--sh-lg);animation:modalIn .25s ease;overflow:hidden}
  .perm-head{padding:22px 24px 0;display:flex;align-items:flex-start;justify-content:space-between}
  .perm-head h3{font-size:17px;font-weight:700;color:var(--g800)}
  .perm-body{padding:14px 24px 24px}
  .perm-body .field{margin-bottom:12px}
  .perm-body .field label{font-size:12px;font-weight:600;color:var(--g500);margin-bottom:4px;display:block}
  .perm-body .field select,.perm-body .field input{width:100%;padding:10px 14px;border:1.5px solid var(--g200);border-radius:var(--r-sm);font-size:14px;font-family:inherit}
  .perm-body .field select:focus,.perm-body .field input:focus{outline:none;border-color:var(--pri)}

  /* ===== TOAST ===== */
  .toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-90px);background:linear-gradient(135deg,var(--ok),#34d399);color:#fff;padding:14px 26px;border-radius:var(--r);font-size:15px;font-weight:700;box-shadow:var(--sh-lg);z-index:3000;opacity:0;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s;display:flex;align-items:center;gap:10px;max-width:92vw;text-align:center}
  .toast.show{transform:translate(-50%,0);opacity:1}

  .sec,.cbox{overflow-x:auto}
  @media(max-width:900px){
    .topnav{padding:10px 16px;height:auto;gap:6px}
    .brand .logo{width:36px;height:36px;font-size:15px;border-radius:10px}
    .brand .txt h1{font-size:13px}
    .nav-tab{padding:7px 14px;font-size:12px}
    .pg{padding:12px 12px 36px}
    .card{padding:14px 14px}
    .bar{gap:10px}
    .charts{grid-template-columns:1fr}
    .be-head{flex-direction:column;align-items:flex-start}
    .filters{width:100%}
    .modal{max-width:94vw;max-height:88vh;overflow-y:auto}
    .perm-box{max-width:94vw;max-height:88vh;overflow-y:auto}
    .pw-box{max-width:92vw}
  }
  @media(max-width:640px){
    .topnav{flex-direction:row;flex-wrap:wrap}
    .bar .field{width:100%}
    .field input,.field select{width:100%;min-width:0;font-size:16px}
    .prog{width:100%;margin-left:0}
    .prog .track{flex:1}
    .cgrid{grid-template-columns:repeat(3,1fr);gap:8px}
    .ccard{padding:10px 8px}
    .ccard .cnum{font-size:10px;margin-bottom:4px}
    .ccard .tname{font-size:13px;padding:4px 6px;line-height:1.35;display:block;text-align:center}
    .ccard .tbadge{top:4px;right:4px;font-size:9px;padding:1px 5px}
    .gtabs{gap:5px;margin-bottom:10px}
    .gtab{padding:7px 10px;font-size:12px;flex:1 1 auto;min-width:calc(33.3% - 8px);text-align:center}
    .stats{grid-template-columns:repeat(2,1fr);gap:8px}
    .scard{padding:12px 6px}
    .scard .num{font-size:24px}
    .submit-box h3{font-size:13px}
    .submit-btn{width:100%}
    .btn{padding:10px 14px}
    .btn-pri{width:100%}
    .submit-row{flex-direction:column;align-items:stretch;gap:8px}
    .hint{text-align:center}
    .brow .bl{width:56px;font-size:11px}
    .brow .bt{height:20px}
    .opt-btn{padding:12px 10px}
    .opt-btn .ico{width:34px;height:34px;font-size:16px}
    .modal-head{padding:16px 16px 0}
     .modal-body{padding:12px 16px 16px}
     .modal-sub{font-size:12px}
     .sub-actions .btn{width:auto;flex:1}
     .sub-input textarea,.sub-input input{font-size:16px}
    .issues li{font-size:12px}
    .sec h3{font-size:14px}
    table.dt{font-size:12px}
    table.dt th{padding:8px 6px;font-size:11px}
    table.dt td{padding:8px 6px}
    .be-head .filters select,.be-head .filters input{font-size:14px;min-width:0}
    .filters{display:flex;flex-wrap:wrap}
    .filters select,.filters input{flex:1 1 45%}
    .prog .lbl{font-size:12px}
    .stat-cards{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:420px){
    .cgrid{grid-template-columns:repeat(3,1fr)}
    .ccard .tname{font-size:12px}
    .gtab{padding:6px 4px;font-size:11px;min-width:calc(50% - 6px)}
    .brand .txt .sub{display:none}
    .modal .btn{font-size:13px}
  }
  @supports(padding:max(0px)){
    .topnav,.submit-box,.be-head{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
    .pg{padding-bottom:max(32px,env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>

<!-- ===== TOP NAV ===== -->
<nav class="topnav">
  <div class="brand">
    <div class="logo">金</div>
    <div class="txt">
      <h1>福州金山小学 早读巡课系统</h1>
      <p>2026-2027学年</p>

  <div class="nav-tabs">

<!-- ===== 巡课端 ===== -->
<div id="pg-patrol" class="pg on">
  <div class="card bar">
    <div class="field"><label>日期（自动）</label><input type="date" id="inp-date" disabled></div>
    <div class="field"><label>星期</label>
      <select id="inp-wday" onchange="onWdayChange()">
        <option value="0">星期一</option><option value="1">星期二</option><option value="2">星期三</option><option value="3">星期四</option><option value="4">星期五</option>
      </select>
    </div>
    <div class="field"><label>检查人员 <span style="color:var(--err)">*</span></label><input type="text" id="inp-inspector" placeholder="必填" oninput="saveInsp()"></div>
    <div class="prog">
      <div class="track"><div class="fill" id="prog-fill" style="width:0%"></div></div>
      <div class="lbl" id="prog-lbl">0 / 0</div>
    </div>
  </div>
  <div class="gtabs" id="gtabs"></div>
  <div class="cgrid" id="cgrid"></div>
  <div class="card submit-box">
    <h3><span class="dot"></span>巡课反馈 <span style="color:var(--err);font-weight:400;font-size:12px">（3条均为必填）</span></h3>
    <textarea id="inp-fb1" placeholder="反馈1：请填写巡课中发现的问题或建议..."></textarea>
    <textarea id="inp-fb2" placeholder="反馈2：请填写巡课中发现的问题或建议..." style="margin-top:8px"></textarea>
    <textarea id="inp-fb3" placeholder="反馈3：请填写巡课中发现的问题或建议..." style="margin-top:8px"></textarea>
    <div class="submit-row">
      <button class="btn btn-pri" onclick="doSubmit()">提交巡课记录</button>
      <span class="hint" id="submit-hint"></span>
    </div>
  </div>
</div>

<!-- ===== 后台统计 ===== -->
<div id="pg-backend" class="pg">
  <div class="card be-head">
    <h2>巡课数据统计</h2>
    <div class="filters">
      <select id="st-view" onchange="renderBE()"><option value="overview">总览</option><option value="by-class">按班级</option><option value="by-day">按日期</option><option value="by-week">按周</option><option value="by-teacher">教师表扬排行</option><option value="issues">问题汇总</option></select>
      <select id="st-grade" onchange="renderBE()"><option value="all">全部年级</option><option value="一年级">一年级</option><option value="二年级">二年级</option><option value="三年级">三年级</option><option value="四年级">四年级</option><option value="五年级">五年级</option><option value="六年级">六年级</option></select>
      <input type="date" id="st-ds" onchange="renderBE()"><span style="color:var(--g400)">至</span><input type="date" id="st-de" onchange="renderBE()">
      <button class="btn btn-ghost" style="font-size:13px" onclick="openCloud()">☁️ 云端同步</button>
      <button class="btn btn-ghost" style="font-size:13px" onclick="openPermEdit()">永久修改教师</button>
      <button class="btn btn-ghost" style="font-size:13px" onclick="exportExcel()">导出Excel</button>
      <button class="btn btn-ghost" style="font-size:13px" onclick="exportData()">导出数据备份</button>
      <button class="btn btn-ghost" style="font-size:13px" onclick="document.getElementById('import-file').click()">导入数据</button>
      <button class="btn btn-ghost" style="font-size:13px;color:var(--err);border:1px solid var(--err)" onclick="clearAllData()">清空全部数据</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>
  <div id="be-body"></div>
</div>

<!-- ===== MODAL: teacher action ===== -->
<div class="overlay" id="ov-modal">
  <div class="modal">
    <div class="modal-head">
      <div><h3 id="m-title">老师操作</h3></div>
      <button class="close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-sub" id="m-sub"></div>
      <div class="sub-input" id="box-rename">
        <input type="text" id="inp-rename" placeholder="输入新名字（仅本次巡课）">
        <div class="sub-actions">
          <button class="btn btn-pri" style="font-size:13px;padding:9px 18px" onclick="doRename()">确认修改</button>
          <button class="btn btn-ghost" style="font-size:13px;padding:9px 18px" onclick="toggleBox('rename')">取消</button>
        </div>
      </div>
      <div class="opt-list" id="m-opts">
        <button class="opt-btn" onclick="pickAction('praise')"><div class="ico ico-p">👍</div><div><div class="lbl">表扬</div><div class="desc">表现优秀，值得肯定</div></div></button>
        <button class="opt-btn" onclick="pickAction('need-attention')"><div class="ico ico-n">⚠️</div><div><div class="lbl">需要关注</div><div class="desc">存在一定问题，需关注改进</div></div></button>
        <button class="opt-btn" onclick="toggleBox('other')"><div class="ico ico-o">📝</div><div><div class="lbl">其他</div><div class="desc">自定义备注</div></div></button>
        <button class="opt-btn" onclick="toggleBox('rename')"><div class="ico ico-r">✏️</div><div><div class="lbl">修改教师名字</div><div class="desc">仅本次巡课生效，不影响总表</div></div></button>
        <button class="opt-btn" id="undo-btn" style="display:none" onclick="undoAction()"><div class="ico" style="background:var(--err-bg);color:var(--err)">↩️</div><div><div class="lbl">撤销本次评价</div><div class="desc">点错了？撤销后该班恢复为待反馈</div></div></button>
      </div>
      <div class="sub-input" id="box-other">
        <textarea id="inp-other" placeholder="请输入备注内容..."></textarea>
        <div class="sub-actions">
          <button class="btn btn-pri" style="font-size:13px;padding:9px 18px" onclick="pickAction('other')">确认</button>
          <button class="btn btn-ghost" style="font-size:13px;padding:9px 18px" onclick="toggleBox('other')">取消</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== PASSWORD MODAL ===== -->
<div class="pw-overlay" id="ov-pw">
  <div class="pw-box">
    <div class="pw-icon">🔐</div>
    <h3>后台访问验证</h3>
    <p>请输入管理员密码进入后台统计</p>
    <input type="password" id="pw-input" placeholder="请输入密码" onkeydown="if(event.key==='Enter')checkPW()">
    <div class="pw-err" id="pw-err">密码错误，请重试</div>
    <button class="btn btn-pri" onclick="checkPW()">确认进入</button>
    <button class="btn btn-ghost" style="margin-top:8px;width:100%" onclick="closePW()">取消</button>
  </div>
</div>

<!-- ===== PERMANENT EDIT MODAL ===== -->
<div class="perm-overlay" id="ov-perm">
  <div class="perm-box">
    <div class="perm-head">
      <h3>永久修改教师名字</h3>
      <button class="close" onclick="closePermEdit()">&times;</button>
    </div>
    <div class="perm-body">
      <div class="field"><label>选择星期</label>
        <select id="pe-wday" onchange="loadPermClasses()"><option value="星期一">星期一</option><option value="星期二">星期二</option><option value="星期三">星期三</option><option value="星期四">星期四</option><option value="星期五">星期五</option></select>
      </div>
      <div class="field"><label>选择年级</label>
        <select id="pe-grade" onchange="loadPermClasses()"><option value="一年级">一年级</option><option value="二年级">二年级</option><option value="三年级">三年级</option><option value="四年级">四年级</option><option value="五年级">五年级</option><option value="六年级">六年级</option></select>
      </div>
      <div class="field"><label>选择班级</label>
        <select id="pe-class" onchange="loadPermTeacher()"></select>
      </div>
      <div class="field"><label>当前教师</label><input type="text" id="pe-current" readonly style="background:var(--g50)"></div>
      <div class="field"><label>修改为</label><input type="text" id="pe-new" placeholder="输入新教师名字"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-pri" style="flex:1" onclick="doPermEdit()">保存修改</button>
        <button class="btn btn-ghost" style="flex:0" onclick="closePermEdit()">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== CLOUD SYNC MODAL (腾讯云) ===== -->
<div class="overlay" id="ov-cloud">
  <div class="modal" style="max-width:540px">
    <div class="modal-head">
      <h3>云端同步</h3>
      <button class="close" onclick="closeCloud()">&times;</button>
    </div>
    <div class="modal-body">
      <div id="cloud-status-box" style="padding:12px 16px;border-radius:var(--r-sm);margin-bottom:16px;font-size:13px;font-weight:600"></div>

      </div>
    </div>
  </div>
</div>

const GRADES=["一年级","二年级","三年级","四年级","五年级","六年级"];
const WDAYS=["星期一","星期二","星期三","星期四","星期五"];
const PW="jsxxjdc";
let backendUnlocked=false;

// STATE
let S={grade:'一年级',wdIdx:0,rec:{},fb:'',inspector:'',modal:null};

function loadS(){try{const d=JSON.parse(localStorage.getItem('ps'));if(d){S.rec=d.rec||{};S.inspector=d.inspector||''}}catch(e){}}
function saveS(){try{localStorage.setItem('ps',JSON.stringify({rec:S.rec,inspector:S.inspector}))}catch(e){}}
function saveInsp(){S.inspector=$('inp-inspector').value;saveS()}
function $(id){return document.getElementById(id)}
function getDate(){return $('inp-date').value}
function getWday(){return WDAYS[S.wdIdx]}

// INIT
function init(){
  loadS();
  const now=new Date();
  const today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  $('inp-date').value=today;
  // 跨天自动更新：新的一天清空本地巡课状态（昨天的记录不再显示、不进入今天的提交）
  let lastDate='';
  try{lastDate=localStorage.getItem('cb_lastdate')||'';}catch(e){}
  if(lastDate!==today){S.rec={};S.inspector='';saveS();}
  try{localStorage.setItem('cb_lastdate',today);}catch(e){}
  let di=now.getDay()-1;if(di<0||di>4)di=0;
  S.wdIdx=di;$('inp-wday').value=di;
  if(S.inspector)$('inp-inspector').value=S.inspector;
  renderGTabs();renderGrid();updateProg();
  // 腾讯云免配置：自动连接并拉取云端（已在脚本末尾触发）
}

function onDateChange(){} // 日期自动固定，不允许手动选择
function onWdayChange(){S.wdIdx=+$('inp-wday').value;renderGrid();updateProg();}

// GRADE TABS
function renderGTabs(){$('gtabs').innerHTML=GRADES.map(g=>`<button class="gtab ${g===S.grade?'on':''}" onclick="pickGrade('${g}')">${g}</button>`).join('')}
function pickGrade(g){S.grade=g;renderGTabs();renderGrid();updateProg();}

// GRID
function renderGrid(){
  const g=$('cgrid'),w=getWday(),d=getDate(),gd=SCHEDULE[w]?.[S.grade]||{};
  const cls=Object.keys(gd).sort((a,b)=>parseInt(a)-parseInt(b));
  g.innerHTML=cls.map(c=>{
    const k=`${d}_${S.grade}_${c}`,r=S.rec[k];
    const tn=r?.display||gd[c];
    const done=!!r?.action;
    const cls2=done?'ccard done':'ccard pending';
    const badge=done?'<span class="tbadge done">已反馈</span>':'<span class="tbadge pending">待反馈</span>';
    return `<div class="${cls2}">${badge}<div class="cnum">${c}</div><div class="tname" onclick="openModal('${S.grade}','${esc(c)}','${esc(gd[c])}')">${esc(tn)}</div></div>`;
  }).join('');
}
function esc(s){return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;')}

// PROGRESS
function updateProg(){
  const d=getDate(),w=getWday(),gd=SCHEDULE[w]?.[S.grade]||{};
  const total=Object.keys(gd).length;
  let done=0;
  for(const c of Object.keys(gd)){if(S.rec[`${d}_${S.grade}_${c}`]?.action)done++;}
  const pct=total?Math.round(done/total*100):0;
  $('prog-fill').style.width=pct+'%';
  $('prog-lbl').textContent=`${done} / ${total} 已检查`;
}

// MODAL
const ACTION_LABEL={praise:'👍 表扬',['need-attention']:'⚠️ 需要关注',other:'📝 其他'};
function openModal(g,c,orig){
  S.modal={grade:g,cls:c,orig};
  const d=getDate(),k=`${d}_${g}_${c}`,r=S.rec[k];
  $('m-title').textContent=`${c} · ${g}`;
  const cur=r?.action?`当前已标记：<b style="color:var(--ok)">${ACTION_LABEL[r.action]||r.action}</b> · `:'';
  $('m-sub').innerHTML=`${cur}当前教师：<b>${esc(r?.display||orig)}</b>`;
  // 已评价时显示“撤销”入口
  const undoBtn=$('undo-btn');
  undoBtn.style.display=r?.action?'flex':'none';
  $('inp-rename').value=r?.display||orig;
  $('inp-other').value='';
  ['rename','other'].forEach(x=>toggleBox(x,false));
  $('ov-modal').classList.add('on');
}
function closeModal(){$('ov-modal').classList.remove('on');S.modal=null;}
function toggleBox(which,force){
  const box=$('box-'+which),opts=$('m-opts');
  const show=force!==undefined?force:box.style.display==='none';
  box.style.display=show?'block':'none';
  if(show)opts.style.display='none';else if(!$('box-rename').style.display||$('box-rename').style.display==='none'&&$('box-other').style.display==='none')opts.style.display='flex';
  // Reset opts visibility
  if(!show&&!($('box-rename').style.display==='block')&&!($('box-other').style.display==='block'))opts.style.display='flex';
}
function doRename(){
  const v=$('inp-rename').value.trim();if(!v||!S.modal)return;
  const d=getDate(),k=`${d}_${S.modal.grade}_${S.modal.cls}`;
  if(!S.rec[k])S.rec[k]={};
  S.rec[k].display=v;saveS();renderGrid();updateProg();
  $('m-sub').innerHTML=`当前教师：<b>${esc(v)}</b>`;
  toggleBox('rename',false);
}
function pickAction(action){
  if(!S.modal)return;
  const d=getDate(),insp=S.inspector||$('inp-inspector').value||'未填写';
  const{grade,cls,orig}=S.modal,k=`${d}_${grade}_${cls}`;
  let text='';
  if(action==='other'){
    text=$('inp-other').value.trim();
    if(!text){$('inp-other').style.borderColor='var(--err)';return;}
  }
  const display=S.rec[k]?.display||orig;
  S.rec[k]={action,text,orig,display,date:d,weekday:getWday(),grade,cls,inspector:insp,ts:new Date().toISOString()};
  saveS();closeModal();renderGrid();updateProg();
}

function undoAction(){
  if(!S.modal)return;
  const d=getDate(),k=`${d}_${S.modal.grade}_${S.modal.cls}`;
  if(!S.rec[k]?.action)return;
  delete S.rec[k];
  saveS();closeModal();renderGrid();updateProg();
}

// SUBMIT
function doSubmit(){
  // Check inspector name
  const insp=S.inspector||$('inp-inspector').value.trim();
  if(!insp){$('inp-inspector').classList.add('error');$('submit-hint').textContent='请填写检查人员姓名（必填）';$('submit-hint').style.color='var(--err)';return;}
  $('inp-inspector').classList.remove('error');

  // 三条反馈均为必填
  const fbArr=[1,2,3].map(i=>$('inp-fb'+i).value.trim());
  const emptyIdx=fbArr.findIndex(v=>!v);
  if(emptyIdx>-1){
    $('inp-fb'+(emptyIdx+1)).classList.add('er');
    $('submit-hint').textContent=`请填写第 ${emptyIdx+1} 条巡课反馈（3条均为必填）`;
    $('submit-hint').style.color='var(--err)';
    return;
  }
  [1,2,3].forEach(i=>$('inp-fb'+i).classList.remove('er'));
  const fb=fbArr.map((t,i)=>'反馈'+(i+1)+'：'+t).join('\n');

  const d=getDate(),sub={date:d,weekday:getWday(),inspector:insp,feedback:fb,ts:new Date().toISOString(),records:[]};
  // 提交时将本次所有评价记录回填为实际检查人员（防止先评价后填名字导致漏填）
  for(const[k,r]of Object.entries(S.rec)){
    if(r.date===d){
      r.inspector=insp;
      sub.records.push(r);
    }
  }

  let subs=[];try{subs=JSON.parse(localStorage.getItem('pss')||'[]');}catch(e){}
  // 同一检查人员在同一天再次提交 → 覆盖之前的提交（仅保留最新一份）
  let hadOld=false;
  const preLen=subs.length;
  subs=subs.filter(x=>!(x.date===d&&x.inspector===insp));
  hadOld=subs.length<preLen;
  subs.push(sub);localStorage.setItem('pss',JSON.stringify(subs));
  // 同步到云端
  pushToCloud();
  // 提交后清除单次修改的名字，恢复总表原名
  for(const[k,r]of Object.entries(S.rec)){if(r.date===d){delete r.display;}}
  saveS();renderGrid();updateProg();
  [1,2,3].forEach(i=>$('inp-fb'+i).value='');
  $('submit-hint').textContent='';$('submit-hint').style.color='var(--ok)';
  showToast(hadOld?'✅ 已更新提交（覆盖原记录）！':'✅ 提交成功！数据已同步云端');
}
let toastTimer=null;
function showToast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);

async function ensureCloud(){
  if(authReady)return authReady;
  authReady=(async()=>{
    if(typeof cloudbase==='undefined')throw new Error('cloudbase sdk 未加载');
    if(!cApp)cApp=cloudbase.init({env:ENV_ID,region:ENV_REGION,accessKey:PUB_KEY});

    }catch(e1){
      try{
        const st=await auth.anonymousAuthProvider().signIn();
        user=(st&&(st.user||auth.currentUser))||null;
      }catch(e2){
        try{const s=await auth.getSession();user=(s&&s.data&&s.data.session&&s.data.session.user)||null;}catch(e3){}
      }
    }
    if(!user){
      try{const s=await auth.getSession();user=(s&&s.data&&s.data.session&&s.data.session.user)||null;}catch(e4){}
    }
    if(!user)throw new Error('匿名登录失败');
    cAuthUid=user.id||user.uid||user._id||'';
    cloudConnected=!!cAuthUid;
    console.log('CloudBase 已连接 uid='+cAuthUid);
    return cApp;
  })().catch(e=>{console.error('CloudBase 连接失败:',e);cloudConnected=false;authReady=null;throw e;});

}

// 从云端读取全部设备的文档并聚合
async function pullFromCloud(){
  try{
    const db=await cdb();
    const res=await db.collection(COLL).limit(1000).get();
    const docs=res.data||[];
    const allSubs=[];
    let latestPerm=null, latestPt=0;
    // 汇总各设备删除标记与清空标记
    const deletedSet=new Set();
    let clearedAt='';
    for(const d of docs){
      if(Array.isArray(d.submissions))allSubs.push(...d.submissions);
      if(Array.isArray(d.deleted))for(const t of d.deleted)if(t)deletedSet.add(t);
      if(d.clearedAt&&(!clearedAt||d.clearedAt>clearedAt))clearedAt=d.clearedAt;
      if(d.perm_schedule&&d.perm_schedule.updatedAt){
        const t=new Date(d.perm_schedule.updatedAt).getTime();
        if(t>latestPt){latestPt=t;latestPerm=d.perm_schedule;}
      }
    }
    // 合并去重（按 ts）
    const map=new Map();
    for(const s of allSubs){if(s&&s.ts&&!map.has(s.ts))map.set(s.ts,s);}
    let merged=Array.from(map.values()).sort((a,b)=>(a.ts>b.ts?1:-1));
    // 过滤已删除 / 清空标记之前的记录
    merged=merged.filter(s=>!deletedSet.has(s.ts)&&!(clearedAt&&s.ts&&s.ts<clearedAt));
    // 同一检查人同一天的多次提交只保留最新一条（覆盖提交场景）
    const byKey=new Map();
    for(const s of merged){const key=(s.date||'')+'|'+(s.inspector||'');const old=byKey.get(key);if(!old||(s.ts||'')>(old.ts||''))byKey.set(key,s);}
    merged=Array.from(byKey.values()).sort((a,b)=>(a.ts>b.ts?1:-1));
    // 规范化：历史记录中检查人漏填(空/未填写)时按该次提交的检查人回填
    for(const s of merged){
      if(s&&Array.isArray(s.records)){
        for(const r of s.records){if(r&&(!r.inspector||r.inspector==='未填写')&&s.inspector)r.inspector=s.inspector;}
      }
    }
    localStorage.setItem('pss',JSON.stringify(merged));
    if(latestPerm){Object.assign(SCHEDULE,latestPerm.data||{});try{localStorage.setItem('perm_schedule',JSON.stringify(latestPerm.data||{}));}catch(e){}}
    // 恢复本人在今天已提交的评价到巡课端（仅本设备/本人数据，看不到别人的）
    restoreToday();
    if($('pg-backend')&&$('pg-backend').classList.contains('on'))renderBE();
    renderGrid();updateProg();
    console.log('云端拉取成功，共 '+merged.length+' 条提交');
    return merged;
  }catch(e){console.error('云端拉取失败:',e);return null;}
}

// 将本机提交上传到云端（每人一个文档，文档ID由匿名用户uid派生）
async function pushToCloud(){
  try{
    const db=await cdb();
    const subs=JSON.parse(localStorage.getItem('pss')||'[]');
    // 本机归属的记录：uid 等于本机 uid 或尚未标记 uid（本地新提交归本机），并回填漏填的检查人
    const mine=subs.filter(s=>!s.uid||s.uid===cAuthUid).map(s=>({...s,uid:cAuthUid}));
    for(const s of mine){
      if(s&&Array.isArray(s.records)){
        for(const r of s.records){if(r&&(!r.inspector||r.inspector==='未填写')&&s.inspector)r.inspector=s.inspector;}
      }
    }
    const psStr=localStorage.getItem('perm_schedule');
    let permObj=null;
    if(psStr){const data=JSON.parse(psStr);permObj={data:data,updatedAt:new Date().toISOString()};}
    // 携带本机删除/清空标记
    const flags=getFlags();
    const payload={submissions:mine,deleted:flags.deleted,clearedAt:flags.clearedAt,updatedAt:new Date().toISOString()};
    if(permObj)payload.perm_schedule=permObj;
    const did=shortUid();
    await db.collection(COLL).doc(did).set(payload);
    // 更新本地记录的 uid 归属，避免重复上传
    const merged=subs.map(s=>(s.uid? s : {...s,uid:cAuthUid}));
    localStorage.setItem('pss',JSON.stringify(merged));
    console.log('云端上传成功，本机 '+mine.length+' 条');
    // 上传后拉取一次全局数据，保证各端一致
    pullFromCloud();
  }catch(e){console.error('云端上传失败:',e);}
}

  if(!mine)return;
  let changed=false;
  for(const r of mine.records){
    if(r&&r.grade&&r.cls){
      const k=`${d}_${r.grade}_${r.cls}`;
      if(!S.rec[k]){S.rec[k]=r;changed=true;}
    }
  }
  if(!S.inspector&&mine.inspector){
    S.inspector=mine.inspector;
    const el=$('inp-inspector');if(el)el.value=mine.inspector;

  }

}

function getFiltered(){
  let subs=[];try{subs=JSON.parse(localStorage.getItem('pss')||'[]');}catch(e){}
  const gf=$('st-grade').value,ds=$('st-ds').value,de=$('st-de').value;
  let all=[];
  for(const s of subs)for(const r of s.records){
    let ok=true;
    if(gf!=='all'&&r.grade!==gf)ok=false;
    if(ds&&r.date<ds)ok=false;
    if(de&&r.date>de)ok=false;
    if(ok)all.push({...r,feedback:s.feedback});
  }
  return{subs,all};
}

function renderBE(){
  const v=$('st-view').value,{subs,all}=getFiltered();
  let h='';
  if(!all.length&&v!=='overview')h='<div class="empty"><div class="ei">📊</div>暂无巡课数据，请先在巡课端完成检查并提交</div>';
  else{
    switch(v){
      case'overview':h=rOverview(subs,all);break;
      case'by-class':h=rByClass(all);break;
      case'by-day':h=rByDay(subs,all);break;
      case'by-week':h=rByWeek(subs,all);break;
      case'by-teacher':h=rByTeacher(all);break;
      case'issues':h=rIssues(subs,all);break;
    }
  }
  $('be-body').innerHTML=h;
}

function rOverview(subs,all){
  const pc=all.filter(r=>r.action==='praise').length;
  const ac=all.filter(r=>r.action==='need-attention').length;
  const oc=all.filter(r=>r.action==='other').length;
  const ut=new Set(all.map(r=>r.display||r.orig)).size;
  const ic=subs.filter(s=>s.feedback).length;
  const today=new Date().toISOString().slice(0,10);
  const td=all.filter(r=>r.date===today);

  let h=`<div class="stats">
    <div class="scard c-pri"><div class="num">${all.length}</div><div class="lbl">总检查次数</div></div>
    <div class="scard c-ok"><div class="num">${pc}</div><div class="lbl">表扬次数</div></div>
    <div class="scard c-warn"><div class="num">${ac}</div><div class="lbl">需关注次数</div></div>
    <div class="scard c-cyan"><div class="num">${oc}</div><div class="lbl">其他备注</div></div>
    <div class="scard c-err"><div class="num">${ic}</div><div class="lbl">反馈问题数</div></div>
    <div class="scard c-pri"><div class="num">${ut}</div><div class="lbl">涉及教师</div></div>
  </div>
  <div class="charts">
    <div class="cbox"><h4>今日检查 (${today})</h4>`;
  if(!td.length)h+='<div class="empty" style="padding:20px">今日暂无数据</div>';
  else{
    const gs=[...new Set(td.map(r=>r.grade))];
    for(const g of gs){
      const gr=td.filter(r=>r.grade===g),p=gr.filter(r=>r.action==='praise').length,n=gr.filter(r=>r.action==='need-attention').length,o=gr.filter(r=>r.action==='other').length,t=gr.length;
      h+=`<div style="margin-bottom:14px"><div style="font-size:13px;font-weight:700;margin-bottom:6px;color:var(--g600)">${g} <span style="color:var(--g400);font-weight:400">共${t}班</span></div>`;
      if(p)h+=brow('表扬',p,t,'praise');
      if(n)h+=brow('需关注',n,t,'atten');
      if(o)h+=brow('其他',o,t,'other');
      h+=`</div>`;
    }
  }
  h+=`</div><div class="cbox"><h4>各年级检查汇总</h4>`;
  const gs=[...new Set(all.map(r=>r.grade))];
  const mx=Math.max(...gs.map(g=>all.filter(r=>r.grade===g).length),1);
  for(const g of gs){const c=all.filter(r=>r.grade===g).length;const p=all.filter(r=>r.grade===g&&r.action==='praise').length;h+=brow(g,c,mx,'praise',`${c}次 (${p}表扬)`);}
  h+=`</div></div>`;
  h+=`<div class="sec"><h3><span class="dot"></span>最近提交记录</h3>`;
  if(!subs.length)h+='<div class="empty" style="padding:20px">暂无提交记录</div>';
  else{
    h+=`<table class="dt"><thead><tr><th>提交时间</th><th>日期</th><th>星期</th><th>检查人员</th><th>检查班数</th><th>反馈</th></tr></thead><tbody>`;
    const recent=subs.slice().sort((a,b)=>(a.ts>b.ts?-1:1)).slice(0,10);
    for(const s of recent)h+=`<tr><td><strong>${fmtTime(s.ts)}</strong></td><td>${s.date}</td><td>${s.weekday}</td><td>${s.inspector}</td><td>${s.records.length}</td><td style="max-width:300px;word-break:break-all">${s.feedback}</td></tr>`;
    h+=`</tbody></table>`;
  }
  h+=`</div>`;
  return h;
}

function brow(label,val,max,type,labelText){
  const pct=val/max*100;
  const cls=type==='praise'?'bi-praise':type==='atten'?'bi-atten':'bi-other';
  return `<div class="brow"><div class="bl">${label}</div><div class="bt"><div class="bi ${cls}" style="width:${Math.max(pct,5)}%">${labelText||''}</div></div><div class="bc">${val}</div></div>`;
}

function fmtTime(iso){
  if(!iso)return '-';
  try{
    const d=new Date(iso);
    if(isNaN(d.getTime()))return iso;
    const p=n=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }catch(e){return iso;}
}

function rByClass(all){
  const gm={};
  for(const r of all){const k=`${r.grade} ${r.cls}`;if(!gm[k])gm[k]={p:0,n:0,o:0};if(r.action==='praise')gm[k].p++;else if(r.action==='need-attention')gm[k].n++;else gm[k].o++;}
  const keys=Object.keys(gm).sort();
  let h=`<div class="sec"><h3><span class="dot"></span>按班级统计</h3><table class="dt"><thead><tr><th>班级</th><th>表扬</th><th>需关注</th><th>其他</th><th>总计</th></tr></thead><tbody>`;
  for(const k of keys){const g=gm[k],t=g.p+g.n+g.o;h+=`<tr><td><strong>${k}</strong></td><td><span class="bdg g">${g.p}</span></td><td><span class="bdg y">${g.n}</span></td><td><span class="bdg b">${g.o}</span></td><td>${t}</td></tr>`;}
  h+=`</tbody></table></div>`;
  // stacked bar
  if(keys.length){
    h+=`<div class="sec"><h3><span class="dot"></span>班级分布</h3><div class="cbox">`;
    for(const k of keys){const g=gm[k],t=g.p+g.n+g.o;
      h+=`<div style="margin-bottom:12px"><div style="font-size:13px;font-weight:700;margin-bottom:4px;color:var(--g600)">${k} <span style="color:var(--g400);font-weight:400">${t}次</span></div><div style="display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--g200)">`;
      if(g.p)h+=`<div style="width:${g.p/t*100}%;background:var(--ok)"></div>`;
      if(g.n)h+=`<div style="width:${g.n/t*100}%;background:var(--warn)"></div>`;
      if(g.o)h+=`<div style="width:${g.o/t*100}%;background:var(--cyan)"></div>`;
      h+=`</div></div>`;
    }
    h+=`<div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--g400)"><span>🟢 表扬</span><span>🟡 需关注</span><span>🔵 其他</span></div></div></div>`;
  }
  return h;
}

function rByDay(subs,all){
  // 按日期范围过滤后，列出每一次提交（含提交时间与检查人员）
  const gf=$('st-grade').value,ds=$('st-ds').value,de=$('st-de').value;
  let list=subs.filter(s=>s.date);
  if(ds)list=list.filter(s=>s.date>=ds);
  if(de)list=list.filter(s=>s.date<=de);
  if(gf!=='all')list=list.filter(s=>s.records&&s.records.some(r=>r.grade===gf));
  list=list.slice().sort((a,b)=>(a.ts<b.ts?1:-1));
  let h=`<div class="sec"><h3><span class="dot"></span>按日期统计（每次提交）</h3>`;
  if(!list.length)h+='<div class="empty" style="padding:20px">暂无数据</div>';
  else{
    h+=`<table class="dt"><thead><tr><th>提交时间</th><th>日期</th><th>星期</th><th>检查人员</th><th>班数</th><th>表扬</th><th>关注</th><th>其他</th><th>反馈</th><th>操作</th></tr></thead><tbody>`;
    for(const s of list){
      const pR=s.records.filter(r=>r.action==='praise');
      const nR=s.records.filter(r=>r.action==='need-attention');
      const oR=s.records.filter(r=>r.action==='other');
      const pT=pR.length?' title="'+esc('表扬：'+pR.map(r=>`${r.grade} ${r.cls} ${r.display||r.orig}`).join('、'))+'"':'';
      const nT=nR.length?' title="'+esc('需关注：'+nR.map(r=>`${r.grade} ${r.cls} ${r.display||r.orig}`).join('、'))+'"':'';
      const oT=oR.length?' title="'+esc('其他：'+oR.map(r=>`${r.grade} ${r.cls} ${r.display||r.orig}`).join('、'))+'"':'';
      h+=`<tr><td><strong>${fmtTime(s.ts)}</strong></td><td>${s.date}</td><td>${s.weekday}</td><td>${s.inspector}</td><td>${s.records.length}</td><td><span class="bdg g"${pT}>${pR.length}</span></td><td><span class="bdg y"${nT}>${nR.length}</span></td><td><span class="bdg b"${oT}>${oR.length}</span></td><td style="max-width:180px;word-break:break-all;font-size:12px">${(s.feedback||'-').split('\n').join('<br>')}</td><td><a href="javascript:void(0)" style="color:var(--err);font-weight:700" onclick="delSubmission('${String(s.ts||'').replace(/'/g,"\\'")}')">删除</a></td></tr>`;
    }
    h+=`</tbody></table>`;
  }
  h+=`</div>`;return h;
}

function rByWeek(subs,all){
  const wm={};
  for(const r of all){const d=new Date(r.date),ys=new Date(d.getFullYear(),0,1),wk=Math.ceil(((d-ys)/864e5+ys.getDay()+1)/7),k=`${d.getFullYear()}-W${String(wk).padStart(2,'0')}`;if(!wm[k])wm[k]=[];wm[k].push(r);}
  const weeks=Object.keys(wm).sort().reverse();
  let h=`<div class="sec"><h3><span class="dot"></span>按周统计</h3>`;
  if(!weeks.length)h+='<div class="empty" style="padding:20px">暂无数据</div>';
  else{
    h+=`<table class="dt"><thead><tr><th>周次</th><th>天数</th><th>班数</th><th>表扬</th><th>关注</th><th>其他</th></tr></thead><tbody>`;
    for(const w of weeks){const rs=wm[w],ud=new Set(rs.map(r=>r.date)).size,p=rs.filter(r=>r.action==='praise').length,n=rs.filter(r=>r.action==='need-attention').length,o=rs.filter(r=>r.action==='other').length;
      h+=`<tr><td><strong>${w}</strong></td><td>${ud}</td><td>${rs.length}</td><td><span class="bdg g">${p}</span></td><td><span class="bdg y">${n}</span></td><td><span class="bdg b">${o}</span></td></tr>`;}
    h+=`</tbody></table>`;
  }
  h+=`</div>`;return h;
}

function rByTeacher(all){
  const tm={};
  for(const r of all){const n=r.display||r.orig;if(!tm[n])tm[n]={p:0,n:0,o:0,grade:r.grade};if(r.action==='praise')tm[n].p++;else if(r.action==='need-attention')tm[n].n++;else tm[n].o++;}
  const ts=Object.entries(tm).map(([name,d])=>({name,...d,t:d.p+d.n+d.o})).sort((a,b)=>b.p-a.p||a.n-b.n);
  let h=`<div class="sec"><h3><span class="dot"></span>教师表扬排行</h3>`;
  if(!ts.length)h+='<div class="empty" style="padding:20px">暂无数据</div>';
  else{
    const mx=Math.max(...ts.map(t=>t.p),1);
    h+=`<div class="cbox">`;
    for(let i=0;i<Math.min(ts.length,30);i++){const t=ts[i];h+=brow(t.name,t.p,mx,'praise');}
    h+=`</div><table class="dt" style="margin-top:16px"><thead><tr><th>#</th><th>教师</th><th>年级</th><th>表扬</th><th>关注</th><th>其他</th></tr></thead><tbody>`;
    for(let i=0;i<ts.length;i++){const t=ts[i];h+=`<tr><td>${i+1}</td><td><strong>${t.name}</strong></td><td>${t.grade}</td><td><span class="bdg g">${t.p}</span></td><td><span class="bdg y">${t.n}</span></td><td><span class="bdg b">${t.o}</span></td></tr>`;}
    h+=`</tbody></table>`;
  }
  h+=`</div>`;return h;
}

function rIssues(subs,all){
  let h=`<div class="sec"><h3><span class="dot"></span>巡课反馈汇总</h3>`;
  const fs=subs.filter(s=>s.feedback);
  if(!fs.length)h+='<div class="empty" style="padding:20px">暂无反馈问题</div>';
  else{h+=`<ul class="issues">`;for(const s of fs.slice().sort((a,b)=>(a.ts<b.ts?1:-1)))h+=`<li><span class="im">${fmtTime(s.ts)}</span><span class="bdg gray">${s.inspector}</span><span class="it">${s.feedback}</span></li>`;h+=`</ul>`;}
  const att=all.filter(r=>r.action==='need-attention');
  if(att.length){h+=`<h3 style="margin-top:20px"><span class="dot" style="background:var(--warn)"></span>需关注教师明细</h3><table class="dt"><thead><tr><th>提交时间</th><th>日期</th><th>班级</th><th>教师</th><th>检查人员</th><th>备注</th></tr></thead><tbody>`;
    for(const r of att)h+=`<tr><td>${fmtTime(r.ts)}</td><td>${r.date}</td><td>${r.grade} ${r.cls}</td><td><strong>${r.display||r.orig}</strong></td><td>${r.inspector||'-'}</td><td>${r.text||'-'}</td></tr>`;
    h+=`</tbody></table>`;}
  h+=`</div>`;return h;
}

// ============================================================
// EXCEL EXPORT
// ============================================================
function exportExcel(){
  const{subs,all}=getFiltered();
  if(!all.length){alert('暂无数据可导出');return;}

  const wb=XLSX.utils.book_new();

  // Sheet 1: 巡课明细
  const detailData=all.map(r=>({
    '提交时间':fmtTime(r.ts),'日期':r.date,'星期':r.weekday,'年级':r.grade,'班级':r.cls,
    '教师(原)':r.orig,'教师(显示)':r.display||r.orig,
    '评价':r.action==='praise'?'表扬':r.action==='need-attention'?'需要关注':'其他',
    '备注':r.text||'','检查人员':r.inspector
  }));
  const ws1=XLSX.utils.json_to_sheet(detailData);
  ws1['!cols']=[{wch:18},{wch:12},{wch:8},{wch:8},{wch:8},{wch:12},{wch:12},{wch:10},{wch:20},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws1,'巡课明细');

  // Sheet 2: 按班级统计
  const gm={};
  for(const r of all){const k=`${r.grade} ${r.cls}`;if(!gm[k])gm[k]={p:0,n:0,o:0};if(r.action==='praise')gm[k].p++;else if(r.action==='need-attention')gm[k].n++;else gm[k].o++;}
  const classData=Object.entries(gm).sort().map(([k,v])=>({'班级':k,'表扬':v.p,'需关注':v.n,'其他':v.o,'总计':v.p+v.n+v.o}));
  const ws2=XLSX.utils.json_to_sheet(classData);
  XLSX.utils.book_append_sheet(wb,ws2,'按班级统计');

  // Sheet 3: 教师表扬排行
  const tm={};
  for(const r of all){const n=r.display||r.orig;if(!tm[n])tm[n]={p:0,n:0,o:0,grade:r.grade};if(r.action==='praise')tm[n].p++;else if(r.action==='need-attention')tm[n].n++;else tm[n].o++;}
  const teacherData=Object.entries(tm).map(([name,v])=>({'教师':name,'年级':v.grade,'表扬':v.p,'需关注':v.n,'其他':v.o,'总计':v.p+v.n+v.o})).sort((a,b)=>b.表扬-a.表扬);
  const ws3=XLSX.utils.json_to_sheet(teacherData);
  XLSX.utils.book_append_sheet(wb,ws3,'教师表扬排行');

  // Sheet 4: 提交记录
  const subData=subs.map(s=>({'提交时间':fmtTime(s.ts),'日期':s.date,'星期':s.weekday,'检查人员':s.inspector,'检查班数':s.records.length,'反馈':s.feedback}));
  const ws4=XLSX.utils.json_to_sheet(subData);
  XLSX.utils.book_append_sheet(wb,ws4,'提交记录');

  // Sheet 5: 问题汇总
  const issueData=[];
  for(const s of subs.filter(s=>s.feedback)){
    issueData.push({'提交时间':fmtTime(s.ts),'日期':s.date,'星期':s.weekday,'检查人员':s.inspector,'反馈问题':s.feedback});
  }
  for(const r of all.filter(r=>r.action==='need-attention')){
    issueData.push({'提交时间':fmtTime(r.ts),'日期':r.date,'星期':r.weekday,'班级':`${r.grade} ${r.cls}`,'教师':r.display||r.orig,'检查人员':r.inspector||'','备注':r.text||''});
  }
  if(issueData.length){
    const ws5=XLSX.utils.json_to_sheet(issueData);
    XLSX.utils.book_append_sheet(wb,ws5,'问题汇总');
  }

  const today=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,`福州金山小学_早读巡课记录_${today}.xlsx`);
}

// ============================================================
// DATA IMPORT/EXPORT
// ============================================================
function exportData(){
  const data={
    version:1,
    exportTime:new Date().toISOString(),
    submissions:JSON.parse(localStorage.getItem('pss')||'[]'),
    schedule:JSON.parse(localStorage.getItem('perm_schedule')||'null'),
    state:{rec:S.rec,inspector:S.inspector}
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`巡课数据备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(a.href);
}

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.version){alert('数据格式不正确');return;}
      if(!confirm('导入将覆盖当前所有数据，是否继续？'))return;
      if(data.submissions)localStorage.setItem('pss',JSON.stringify(data.submissions));
      if(data.schedule)localStorage.setItem('perm_schedule',JSON.stringify(data.schedule));
      if(data.state){
        S.rec=data.state.rec||{};
        S.inspector=data.state.inspector||'';
        saveS();
      }
      alert('数据导入成功！');
      pushToCloud();
      location.reload();
    }catch(err){alert('导入失败：文件格式错误');}
  };
  reader.readAsText(file);
  e.target.value='';
}
